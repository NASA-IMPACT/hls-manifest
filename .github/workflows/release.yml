name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      # hatch-vcs reads the version from the tag history, so the full history
      # is required for the build to produce the tagged version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: make test
      - run: uv build
      - name: Check the artifact version matches the tag
        run: ls "dist/hls_manifest-${TAG#v}.tar.gz" "dist/hls_manifest-${TAG#v}-py3-none-any.whl"
      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes
          fi
